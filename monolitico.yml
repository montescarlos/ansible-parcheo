---
- name: Parchar Windows Server con prechecks, olas y reporte
  hosts: all
  gather_facts: no

  vars:
    log_path: "C:\\Windows\\Temp\\ansible-winupdates.log"
    reject_kbs:
      - KB5078766
    min_free_gb_c: 10
    max_update_waves: 5
    patch_categories:
      - CriticalUpdates
      - SecurityUpdates
      - UpdateRollups

  tasks:
    - name: Inicializar acumuladores globales
      ansible.builtin.set_fact:
        installed_titles_all: []
        failed_kbs_all: []
        reboot_required_any: false
        remaining_updates_norm: []
        updates_initial_norm: []
      tags:
        - always

    - name: Verificar espacio libre en C
      ansible.windows.win_shell: |
        $disk = Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='C:'"
        [math]::Round($disk.FreeSpace / 1GB, 2)
      register: free_space_c
      changed_when: false
      tags:
        - precheck

    - name: Fallar si no hay espacio suficiente en C
      ansible.builtin.fail:
        msg: >-
          Espacio insuficiente en C:. Libre={{ free_space_c.stdout | trim }} GB.
          Mínimo requerido={{ min_free_gb_c }} GB.
      when: (free_space_c.stdout | trim | replace(',', '.') | float) < min_free_gb_c
      tags:
        - precheck

    - name: Verificar estado del servicio Windows Update
      ansible.windows.win_service:
        name: wuauserv
      register: wuauserv_status
      changed_when: false
      tags:
        - precheck

    - name: Iniciar servicio Windows Update si está detenido
      ansible.windows.win_service:
        name: wuauserv
        state: started
      when: (wuauserv_status.state | default('')) != 'running'
      tags:
        - precheck

    - name: Verificar nuevamente estado del servicio Windows Update
      ansible.windows.win_service:
        name: wuauserv
      register: wuauserv_status_after
      changed_when: false
      tags:
        - precheck

    - name: Fallar si Windows Update no pudo iniciarse
      ansible.builtin.fail:
        msg: >-
          El servicio Windows Update (wuauserv) no pudo quedar en Running.
          Estado actual: {{ wuauserv_status_after.state | default('desconocido') }}
      when: (wuauserv_status_after.state | default('')) != 'running'
      tags:
        - precheck

    - name: Buscar actualizaciones iniciales
      ansible.windows.win_updates:
        category_names: "{{ patch_categories }}"
        state: searched
      register: search_initial
      tags:
        - precheck
        - report

    - name: Normalizar actualizaciones iniciales
      ansible.builtin.set_fact:
        updates_initial_norm: >-
          {{
            (search_initial.updates is mapping)
            | ternary(
                search_initial.updates | dict2items | map(attribute='value') | list,
                search_initial.updates | default([]) | list
              )
          }}
        remaining_updates_norm: >-
          {{
            (search_initial.updates is mapping)
            | ternary(
                search_initial.updates | dict2items | map(attribute='value') | list,
                search_initial.updates | default([]) | list
              )
          }}
      tags:
        - precheck
        - report

    - name: Mostrar inventario inicial
      ansible.builtin.debug:
        msg:
          total_detectadas: "{{ updates_initial_norm | length }}"
          titulos: "{{ updates_initial_norm | selectattr('title', 'defined') | map(attribute='title') | list }}"
          kbs: "{{ updates_initial_norm | selectattr('kb', 'defined') | map(attribute='kb') | flatten | list }}"
      tags:
        - precheck
        - report

    - name: Instalar únicamente Servicing Stack Updates
      ansible.windows.win_updates:
        category_names:
          - ServicingStackUpdates
        state: installed
        reboot: yes
        reboot_timeout: 3600
        log_path: "{{ log_path }}"
      register: ssu_result
      tags:
        - patch

    - name: Esperar WinRM tras SSU
      ansible.builtin.wait_for_connection:
        delay: 15
        timeout: 1200
      tags:
        - patch

    - name: Ejecutar olas de parcheo
      block:
        - name: Buscar updates pendientes antes de la ola {{ wave_no }}
          ansible.windows.win_updates:
            category_names: "{{ patch_categories }}"
            state: searched
          register: search_wave

        - name: Normalizar updates pendientes antes de la ola {{ wave_no }}
          ansible.builtin.set_fact:
            updates_wave_norm: >-
              {{
                (search_wave.updates is mapping)
                | ternary(
                    search_wave.updates | dict2items | map(attribute='value') | list,
                    search_wave.updates | default([]) | list
                  )
              }}

        - name: Mostrar resumen previo de la ola {{ wave_no }}
          ansible.builtin.debug:
            msg:
              wave: "{{ wave_no }}"
              total_pendientes: "{{ updates_wave_norm | length }}"
              titulos: "{{ updates_wave_norm | selectattr('title', 'defined') | map(attribute='title') | list }}"

        - name: Procesar instalación de la ola {{ wave_no }}
          block:
            - name: Instalar updates de la ola {{ wave_no }}
              ansible.windows.win_updates:
                category_names: "{{ patch_categories }}"
                state: installed
                reboot: yes
                reboot_timeout: 3600
                log_path: "{{ log_path }}"
                reject_list: "{{ reject_kbs }}"
              register: wave_install
              when: (updates_wave_norm | length) > 0

            - name: Esperar WinRM tras la ola {{ wave_no }}
              ansible.builtin.wait_for_connection:
                delay: 15
                timeout: 1200
              when: (updates_wave_norm | length) > 0

            - name: Normalizar updates procesadas en la ola {{ wave_no }}
              ansible.builtin.set_fact:
                wave_install_norm: >-
                  {{
                    (wave_install.updates is mapping)
                    | ternary(
                        wave_install.updates | dict2items | map(attribute='value') | list,
                        wave_install.updates | default([]) | list
                      )
                  }}
              when: (updates_wave_norm | length) > 0

            - name: Acumular títulos realmente instalados de la ola {{ wave_no }}
              ansible.builtin.set_fact:
                installed_titles_all: >-
                  {{
                    installed_titles_all
                    +
                    (
                      wave_install_norm
                      | selectattr('installed', 'defined')
                      | selectattr('installed')
                      | selectattr('title', 'defined')
                      | map(attribute='title')
                      | list
                    )
                  }}
              when: (updates_wave_norm | length) > 0

            - name: Acumular KBs fallidas de la ola {{ wave_no }}
              ansible.builtin.set_fact:
                failed_kbs_all: >-
                  {{
                    failed_kbs_all
                    +
                    (
                      wave_install_norm
                      | selectattr('failure_hresult_code', 'defined')
                      | selectattr('kb', 'defined')
                      | map(attribute='kb')
                      | flatten
                      | list
                    )
                  }}
              when: (updates_wave_norm | length) > 0

            - name: Acumular si hubo reboot en la ola {{ wave_no }}
              ansible.builtin.set_fact:
                reboot_required_any: "{{ reboot_required_any or (wave_install.rebooted | default(false)) or (wave_install.reboot_required | default(false)) }}"
              when: (updates_wave_norm | length) > 0

          rescue:
            - name: Mostrar error capturado de la ola {{ wave_no }}
              ansible.builtin.debug:
                var: ansible_failed_result

            - name: Acumular KBs fallidas capturadas en rescue de la ola {{ wave_no }}
              ansible.builtin.set_fact:
                failed_kbs_all: >-
                  {{
                    failed_kbs_all
                    +
                    (
                      (
                        ansible_failed_result.updates | default({})
                      )
                      | dict2items
                      | map(attribute='value')
                      | selectattr('kb', 'defined')
                      | map(attribute='kb')
                      | flatten
                      | list
                    )
                  }}

            - name: Fallar controladamente por error en la ola {{ wave_no }}
              ansible.builtin.fail:
                msg: >-
                  Error durante la ola {{ wave_no }}.
                  KBs afectadas: {{ failed_kbs_all | unique }}.
                  Detalle: {{ ansible_failed_result.msg | default('Sin mensaje') }}.
                  Revisar log en {{ log_path }}.

        - name: Buscar updates pendientes después de la ola {{ wave_no }}
          ansible.windows.win_updates:
            category_names: "{{ patch_categories }}"
            state: searched
          register: search_after_wave

        - name: Normalizar updates pendientes después de la ola {{ wave_no }}
          ansible.builtin.set_fact:
            remaining_updates_norm: >-
              {{
                (search_after_wave.updates is mapping)
                | ternary(
                    search_after_wave.updates | dict2items | map(attribute='value') | list,
                    search_after_wave.updates | default([]) | list
                  )
              }}

        - name: Mostrar resultado de la ola {{ wave_no }}
          ansible.builtin.debug:
            msg:
              wave: "{{ wave_no }}"
              pendientes_despues: "{{ remaining_updates_norm | length }}"
              failed_kbs_acumuladas: "{{ failed_kbs_all | unique }}"

        - name: Abortar si hubo KBs fallidas en la ola {{ wave_no }}
          ansible.builtin.fail:
            msg: >-
              Se detectaron KBs fallidas en la ola {{ wave_no }}: {{ failed_kbs_all | unique }}.
              Se aborta para evitar loops o reintentos innecesarios.
              Revisar log en {{ log_path }}.
          when: (failed_kbs_all | unique | length) > 0
      loop: "{{ range(1, (max_update_waves | int) + 1) | list }}"
      loop_control:
        loop_var: wave_no
      when: (remaining_updates_norm | length) > 0
      tags:
        - patch

    - name: Reporte final
      ansible.builtin.debug:
        msg:
          espacio_libre_c_gb: "{{ free_space_c.stdout | default('N/A') | trim }}"
          estado_wuauserv: "{{ wuauserv_status_after.state | default(wuauserv_status.state | default('N/A')) }}"
          reboot_previo_detectado: false
          total_detectadas_inicialmente: "{{ updates_initial_norm | length }}"
          total_instaladas_reportadas: "{{ installed_titles_all | unique | length }}"
          updates_instaladas: "{{ installed_titles_all | unique }}"
          failed_kbs: "{{ failed_kbs_all | unique }}"
          updates_pendientes_finales: "{{ remaining_updates_norm | length }}"
          titulos_pendientes_finales: "{{ remaining_updates_norm | selectattr('title', 'defined') | map(attribute='title') | list }}"
          reboot_durante_proceso: "{{ reboot_required_any }}"
          reject_kbs_aplicadas: "{{ reject_kbs }}"
          log_path: "{{ log_path }}"
      tags:
        - report

    - name: Fallar si quedaron updates pendientes tras el máximo de olas
      ansible.builtin.fail:
        msg: >-
          Quedaron {{ remaining_updates_norm | length }} actualizaciones pendientes
          después de {{ max_update_waves }} olas.
          Pendientes: {{
            remaining_updates_norm
            | selectattr('title', 'defined')
            | map(attribute='title')
            | list
          }}.
          Revisar log en {{ log_path }}.
      when:
        - (remaining_updates_norm | length) > 0
        - (failed_kbs_all | unique | length) == 0
      tags:
        - report

    - name: Fallar si hubo KBs con error
      ansible.builtin.fail:
        msg: >-
          Se detectaron KBs con error: {{ failed_kbs_all | unique }}.
          Puede excluirlas temporalmente en reject_kbs y reintentar.
          Revisar log en {{ log_path }}.
      when:
        - (failed_kbs_all | unique | length) > 0
      tags:
        - report
