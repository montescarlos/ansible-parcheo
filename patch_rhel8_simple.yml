---
- name: Actualización básica de parches en RHEL 8
  hosts: all
  become: true
  gather_facts: true
  vars:
    reboot_if_required: false

    use_proxy: false
    proxy_url: ""
    no_proxy: "localhost,127.0.0.1,::1,192.168.110.0/24,.mos.lan"

    proxy_env: >-
      {{
        {
          'http_proxy': proxy_url,
          'https_proxy': proxy_url,
          'HTTP_PROXY': proxy_url,
          'HTTPS_PROXY': proxy_url,
          'no_proxy': no_proxy,
          'NO_PROXY': no_proxy
        } if use_proxy | bool else {}
      }}

  tasks:
    - name: Validar que proxy_url esté definido cuando use_proxy=true
      ansible.builtin.assert:
        that:
          - proxy_url | length > 0
        fail_msg: "use_proxy=true, pero proxy_url está vacío. Defina proxy_url en Extra Variables de AWX."
        success_msg: "Proxy configurado correctamente para esta ejecución."
      when: use_proxy | bool

    - name: Validar conectividad con el host
      ansible.builtin.ping:

    - name: Mostrar versión del sistema operativo
      ansible.builtin.debug:
        msg: "Sistema operativo detectado: {{ ansible_distribution }} {{ ansible_distribution_version }}"

    - name: Mostrar kernel actual antes de actualizar
      ansible.builtin.command: uname -r
      register: kernel_actual
      changed_when: false

    - name: Mostrar kernel actual
      ansible.builtin.debug:
        msg: "Kernel actual antes de actualizar: {{ kernel_actual.stdout }}"

    - name: Limpiar caché de DNF
      ansible.builtin.command: dnf clean all
      environment: "{{ proxy_env }}"
      changed_when: false

    - name: Consultar actualizaciones disponibles
      ansible.builtin.command: dnf check-update
      environment: "{{ proxy_env }}"
      register: actualizaciones_disponibles
      changed_when: false
      failed_when: actualizaciones_disponibles.rc not in [0, 100]

    - name: Mostrar resumen de actualizaciones disponibles
      ansible.builtin.debug:
        var: actualizaciones_disponibles.stdout_lines

    - name: Aplicar actualizaciones disponibles
      ansible.builtin.dnf:
        name: "*"
        state: latest
      environment: "{{ proxy_env }}"
      register: resultado_actualizacion

    - name: Mostrar resultado de actualización
      ansible.builtin.debug:
        var: resultado_actualizacion

    - name: Instalar herramienta para validar reinicio requerido
      ansible.builtin.dnf:
        name: yum-utils
        state: present
      environment: "{{ proxy_env }}"

    - name: Verificar si se requiere reinicio
      ansible.builtin.command: needs-restarting -r
      register: reinicio_requerido
      changed_when: false
      failed_when: reinicio_requerido.rc not in [0, 1]

    - name: Mostrar estado de reinicio requerido
      ansible.builtin.debug:
        msg: >-
          {% if reinicio_requerido.rc == 1 %}
          El servidor requiere reinicio después de la actualización.
          {% else %}
          El servidor no requiere reinicio.
          {% endif %}
    
    - name: Reiniciar el servidor si es requerido y autorizado
      ansible.builtin.reboot:
        msg: "Reinicio automático ejecutado por AWX después de aplicar actualizaciones."
        reboot_timeout: 900
        connect_timeout: 30
        pre_reboot_delay: 10
        post_reboot_delay: 30
        test_command: whoami
      when:
        - reinicio_requerido.rc == 1
        - reboot_if_required | bool

    - name: Obtener kernel después del reinicio o validación final
      ansible.builtin.command: uname -r
      register: kernel_despues
      changed_when: false

    - name: Mostrar kernel final activo
      ansible.builtin.debug:
        msg: "Kernel activo al finalizar el playbook: {{ kernel_despues.stdout }}"

    - name: Mostrar resumen final del reinicio
      ansible.builtin.debug:
        msg: >-
          {% if reinicio_requerido.rc == 1 and reboot_if_required | bool %}
          El servidor requería reinicio y fue reiniciado automáticamente.
          {% elif reinicio_requerido.rc == 1 and not reboot_if_required | bool %}
          El servidor requiere reinicio, pero no fue reiniciado porque reboot_if_required=false.
          {% else %}
          El servidor no requiere reinicio.
          {% endif %}
